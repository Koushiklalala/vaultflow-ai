# Render Blueprint Specification for VaultFlow AI
# Deploy with 1-Click on Render (https://render.com)
# Qualifies for: Best Use of Render ($200)

services:
  # Web Frontend Service
  - type: web
    name: vaultflow-ai-web
    env: static
    plan: free
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

