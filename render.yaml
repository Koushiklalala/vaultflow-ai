# Render Blueprint Specification for VaultFlow AI
# Deploy Full-Stack Web Service on Render (https://render.com)
# Qualifies for: Best Use of Render ($200)

services:
  - type: web
    name: vaultflow-ai
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.tabpfn_service:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TABPFN_DEVICE
        value: cpu
